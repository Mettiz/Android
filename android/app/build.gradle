apply plugin: 'com.android.application'

android {
    namespace "ir.fmd.shiftflow.app"
    compileSdk 35
    defaultConfig {
        applicationId "ir.fmd.shiftflow.app"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 3
        versionName "3.0.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
}

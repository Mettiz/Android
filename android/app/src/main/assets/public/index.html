      // Native Android Bridge Integration for Print/PDF & Excel/JSON File Downloads
      (function() {
        window.addEventListener('DOMContentLoaded', function() {
          if (window.AndroidBridge) {
            // 1. Native Android Print / Save-as-PDF
            var origPrint = window.print;
            window.print = function() {
              try {
                window.AndroidBridge.printPage(document.title || 'ShiftFlow-FMD-1405');
              } catch (e) {
                if (origPrint) origPrint.call(window);
              }
            };

            // 2. Intercept <a download="..."> for Blob & Data URLs (Excel .xlsx & JSON exports)
            var origClick = HTMLAnchorElement.prototype.click;
            HTMLAnchorElement.prototype.click = function() {
              var href = this.getAttribute('href') || this.href || '';
              var downloadName = this.getAttribute('download') || '';
              if (downloadName && (href.indexOf('blob:') === 0 || href.indexOf('data:') === 0)) {
                if (href.indexOf('data:') === 0) {
                  var parts = href.split(',');
                  var meta = parts[0] || '';
                  var base64 = parts[1] || '';
                  var mimeMatch = meta.match(/data:([^;]+)/);
                  var mime = (mimeMatch && mimeMatch[1]) || 'application/octet-stream';
                  window.AndroidBridge.saveBase64File(base64, downloadName, mime);
                  return;
                }
                fetch(href)
                  .then(function(res) { return res.blob(); })
                  .then(function(blob) {
                    var reader = new FileReader();
                    reader.onloadend = function() {
                      var result = String(reader.result || '');
                      var base64 = result.split(',')[1] || '';
                      window.AndroidBridge.saveBase64File(
                        base64,
                        downloadName,
                        blob.type || 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
                      );
                    };
                    reader.readAsDataURL(blob);
                  })
                  .catch(function() {
                    origClick.apply(this, arguments);
                  });
                return;
              }
              return origClick.apply(this, arguments);
            };
          }
        });
      })();
